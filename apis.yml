name: AminoChain
description: AminoChain operates a transparent, decentralized research ecosystem for
  patient-centric biomedical research. Its Specimen Center helps researchers discover
  and access legacy biospecimens through decentralized specimen discovery and collaboration,
  while its Donor Platform enables prospective participant registries and manages participant
  involvement in studies. The platform emphasizes privacy-preserving re-engagement,
  cryptographic tracking of biospecimens, auditable consent, and benefit-sharing models
  that return value to patients and donors. Backed by a16z. AminoChain currently exposes
  no public developer API, SDK, or documentation surface.
